name: Day 3 - Python CI

on:
  push:
    branches:
      - main
      
env:
  USERNAME: ${{ secrets.MY_NAME }}

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test tool
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Use secret
        run: echo "Hello ${{ secrets.MY_NAME }}"

